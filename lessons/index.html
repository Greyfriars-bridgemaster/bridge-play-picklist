<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teaching materials by lesson – Greyfriars Bridge School</title>
<meta name="description" content="The presentation from each lesson of the Greyfriars Bridge School, to review at home.">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/site-config.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<div id="site-top"></div>
<main id="main">
  <h1>Teaching materials by lesson</h1>
  <p class="lead">The presentation from each lesson, to review at home. Each opens as a PDF, which you can read on screen or print.</p>

  <section class="card" aria-labelledby="l-h">
    <h2 id="l-h">Lessons</h2>
    <div class="pick" id="pick" hidden>
      <label for="season">Season</label>
      <select id="season"></select>
    </div>
    <div id="out" aria-live="polite"><p>Loading the lessons…</p></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="../assets/site.js" data-root="../" data-here="lessons"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function longDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : ''; }
  var data = null;
  function show(season) {
    var ls = data.lessons.filter(function (l) { return l.season === season; }).sort(function (a, b) {
      var ad = a.date || '9999', bd = b.date || '9999';
      if (ad !== bd) return ad < bd ? -1 : 1;
      var an = parseFloat(a.number), bn = parseFloat(b.number);
      if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
      return a.title < b.title ? -1 : a.title > b.title ? 1 : 0;
    });
    if (!ls.length) { $('out').innerHTML = '<p>No lessons have been added for this season yet. Please check back soon.</p>'; return; }
    $('out').innerHTML = '<ul class="list">' + ls.map(function (l) {
      var igs = data.infographics.filter(function (g) { return g.lessonId === l.id; });
      return '<li><div class="what"><b>' + (l.number ? 'Lesson ' + esc(l.number) + ': ' : '') + esc(l.title) + '</b>' + (l.date ? '<span>' + esc(longDate(l.date)) + '</span>' : '') +
        (igs.length ? '<p class="rel">Infographic: ' + igs.map(function (g) { return '<a href="' + esc(g.fileUrl) + '">' + esc(g.title) + '</a>'; }).join(', ') + '</p>' : '') +
        '</div><div class="links"><a class="btn" href="' + esc(l.fileUrl) + '">Open the lesson (PDF)</a><a class="btn alt" href="' + esc(l.fileUrl) + '?download=1">Download</a></div></li>';
    }).join('') + '</ul>';
  }
  fetch('/api/catalogue', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !Array.isArray(j.lessons) || !Array.isArray(j.infographics)) throw new Error('bad');
    data = j;
    var seasons = j.seasons.filter(function (s) { return j.lessons.some(function (l) { return l.season === s; }); });
    if (!seasons.length) { $('out').innerHTML = '<p>The lessons will appear here soon.</p>'; return; }
    var sel = $('season'); sel.innerHTML = seasons.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('');
    sel.value = seasons.indexOf(j.currentSeason) >= 0 ? j.currentSeason : seasons[0];
    $('pick').hidden = seasons.length < 2;
    sel.addEventListener('change', function () { show(sel.value); });
    show(sel.value);
  }).catch(function () { $('out').innerHTML = '<p>The lessons are not available just now. Please try again later.</p>'; });
})();
</script>
</body>
</html>
